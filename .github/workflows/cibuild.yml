name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    name: Android ${{ matrix.configuration }} ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CFLAGS: "-w"
      CXXFLAGS: "-w"
      NDK_TOOLCHAIN: ${{ github.workspace }}/android-deps/toolchain
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        abi: [arm64-v8a]

    steps:
    - uses: actions/checkout@main
      with:
        submodules: recursive

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26d

    - name: Setup toolchain vars
      run: |
        TC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
        echo "CC=$TC/bin/aarch64-linux-android29-clang" >> $GITHUB_ENV
        echo "CXX=$TC/bin/aarch64-linux-android29-clang++" >> $GITHUB_ENV
        echo "AR=$TC/bin/llvm-ar" >> $GITHUB_ENV
        echo "RANLIB=$TC/bin/llvm-ranlib" >> $GITHUB_ENV
        echo "STRIP=$TC/bin/llvm-strip" >> $GITHUB_ENV
        echo "HOST=aarch64-linux-android" >> $GITHUB_ENV
        sudo apt-get update -qq && sudo apt-get install -qq -y autoconf automake libtool pkg-config

    - name: Get SDL2 headers
      run: |
        git clone --depth 1 --branch release-2.28.x \
          https://github.com/libsdl-org/SDL.git /tmp/SDL
        mkdir -p android-deps/include/SDL2
        cp -r /tmp/SDL/include/* android-deps/include/SDL2/

    - name: Get SDL2 prebuilt
      run: |
        git clone --depth 1 https://github.com/nillerusr/source-engine-libs.git /tmp/se-libs
        mkdir -p android-deps/lib
        cp /tmp/se-libs/android/aarch64/libSDL2.so android-deps/lib/

    - name: Build OpenAL
      run: |
        cd /tmp
        git clone --depth 1 --branch 1.24.0 https://github.com/kcat/openal-soft.git
        cd openal-soft
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.abi }} \
          -DANDROID_PLATFORM=android-29 \
          -DCMAKE_BUILD_TYPE=Release \
          -DALSOFT_UTILS=OFF \
          -DALSOFT_EXAMPLES=OFF \
          -DALSOFT_REQUIRE_ALSA=OFF \
          -DALSOFT_BACKEND_WAVE=OFF
        cmake --build build -j$(nproc)
        mkdir -p $GITHUB_WORKSPACE/android-deps/include/AL
        cp include/AL/al.h $GITHUB_WORKSPACE/android-deps/include/AL/
        cp include/AL/alc.h $GITHUB_WORKSPACE/android-deps/include/AL/
        cp build/libopenal.so $GITHUB_WORKSPACE/android-deps/lib/

    - name: Build libogg
      run: |
        cd /tmp
        git clone --depth 1 --branch v1.3.5 https://github.com/xiph/ogg.git
        cd ogg
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.abi }} \
          -DANDROID_PLATFORM=android-29 \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_TESTING=OFF
        cmake --build build -j$(nproc)
        mkdir -p $GITHUB_WORKSPACE/android-deps/include/ogg
        cp include/ogg/ogg.h $GITHUB_WORKSPACE/android-deps/include/ogg/
        cp include/ogg/os_types.h $GITHUB_WORKSPACE/android-deps/include/ogg/
        cp build/include/ogg/config_types.h $GITHUB_WORKSPACE/android-deps/include/ogg/
        cp build/libogg.a $GITHUB_WORKSPACE/android-deps/lib/

    - name: Build libvorbis
      run: |
        cd /tmp
        git clone --depth 1 --branch v1.3.7 https://github.com/xiph/vorbis.git
        cd vorbis
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.abi }} \
          -DANDROID_PLATFORM=android-29 \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_TESTING=OFF \
          -DOGG_INCLUDE_DIR=$GITHUB_WORKSPACE/android-deps/include \
          -DOGG_LIBRARY=$GITHUB_WORKSPACE/android-deps/lib/libogg.a
        cmake --build build -j$(nproc)
        mkdir -p $GITHUB_WORKSPACE/android-deps/include/vorbis
        cp include/vorbis/codec.h $GITHUB_WORKSPACE/android-deps/include/vorbis/
        cp include/vorbis/vorbisfile.h $GITHUB_WORKSPACE/android-deps/include/vorbis/
        cp include/vorbis/vorbisenc.h $GITHUB_WORKSPACE/android-deps/include/vorbis/
        cp build/lib/libvorbis.a $GITHUB_WORKSPACE/android-deps/lib/
        cp build/lib/libvorbisfile.a $GITHUB_WORKSPACE/android-deps/lib/
        cp build/lib/libvorbisenc.a $GITHUB_WORKSPACE/android-deps/lib/

    - name: Build libtheora
      run: |
        cd /tmp
        git clone --depth 1 --branch v1.1.1 https://github.com/xiph/theora.git
        cd theora
        export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
        export CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++
        export AR=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        export RANLIB=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
        export STRIP=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
        export cross_compiling=yes
        ./autogen.sh
        ./configure --build=x86_64-pc-linux-gnu --host=aarch64-linux-android \
          --prefix=$GITHUB_WORKSPACE/android-deps \
          --disable-examples --disable-doc --disable-spec
        make -j$(nproc)
        make install

    - name: Build LZO
      run: |
        cd /tmp
        wget -q http://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz
        tar xzf lzo-2.10.tar.gz
        cd lzo-2.10
        export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
        export AR=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        export RANLIB=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
        ./configure --host=aarch64-linux-android --enable-static --disable-shared
        make -j$(nproc)
        mkdir -p $GITHUB_WORKSPACE/android-deps/include/lzo
        cp include/lzo/*.h $GITHUB_WORKSPACE/android-deps/include/lzo/
        cp src/.libs/liblzo2.a $GITHUB_WORKSPACE/android-deps/lib/

    - name: Configure CMake for Android
      run: |
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.abi }} \
          -DANDROID_PLATFORM=android-29 \
          -DANDROID_DEPS_DIR=$GITHUB_WORKSPACE/android-deps \
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} \
          -DBUILD_SHARED_LIBS=OFF \
          -DXRAY_USE_LUAJIT=OFF \
          -DXRAY_USE_GLES=ON \
          -DCMAKE_UNITY_BUILD=ON \
          --log-level VERBOSE

    - name: Build
      run: cmake --build build --config ${{ matrix.configuration }} --parallel 4

    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: Android-${{ matrix.abi }}-${{ matrix.configuration }}-github-${{ github.run_number }}
        path: build/libxr_3da.so
